<ion-app>
  <ion-menu contentId="principal">
    <ion-header>
      <ion-toolbar><ion-title>Escuela Ionic</ion-title></ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle [autoHide]="false">
          <ion-item button routerLink="/aprender" routerDirection="root"><ion-icon aria-hidden="true" slot="start" name="school"></ion-icon><ion-label>Aprender</ion-label></ion-item>
          <ion-item button routerLink="/simulacro" routerDirection="root"><ion-icon aria-hidden="true" slot="start" name="reader"></ion-icon><ion-label>Simulacro</ion-label></ion-item>
          <ion-item button routerLink="/playground" routerDirection="root"><ion-icon aria-hidden="true" slot="start" name="flask"></ion-icon><ion-label>Playground</ion-label></ion-item>
          <ion-item button routerLink="/glosario" routerDirection="root"><ion-icon aria-hidden="true" slot="start" name="book"></ion-icon><ion-label>Glosario</ion-label></ion-item>
          <ion-item button routerLink="/perfil" routerDirection="root"><ion-icon aria-hidden="true" slot="start" name="trophy"></ion-icon><ion-label>Logros</ion-label></ion-item>
        </ion-menu-toggle>
      </ion-list>
      <ion-list>
        <ion-list-header><ion-label>Lecciones</ion-label></ion-list-header>
        <ion-menu-toggle [autoHide]="false">
          @for (l of lessons; track l.id; let i = $index) {
            <ion-item button [routerLink]="['/leccion', l.id]" routerDirection="forward" detail="false">
              <ion-label class="ion-text-wrap">{{ i + 1 }}. {{ l.title }}</ion-label>
              @if (done().has(l.id)) { <ion-icon aria-hidden="true" slot="end" name="checkmark-circle" color="success"></ion-icon> }
            </ion-item>
          }
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="principal"></ion-router-outlet>
</ion-app>
