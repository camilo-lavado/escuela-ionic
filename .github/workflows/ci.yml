name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 3

  e2e:
    name: Pruebas e2e (Playwright)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  apk:
    name: APK de depuración
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run apk   # usa JAVA_HOME (JDK 21 de setup-java) y el SDK preinstalado del runner
      - uses: actions/upload-artifact@v4
        with:
          name: escuela-ionic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
